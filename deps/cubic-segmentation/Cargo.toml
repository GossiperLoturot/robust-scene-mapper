[package]
name = "cubic-segmentation"
version = "0.1.0"
edition = "2024"

[dependencies]
bvh = "0.12"
clap = { version = "4", features = ["derive"] }
color-print = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = { version ="0.18", features = ["rayon"] }
nalgebra = "0.34"
rayon = "1"
rusqlite = "0.37"
serde_json = "1"
