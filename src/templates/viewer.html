<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
        #ui-container { position: absolute; top: 10px; left: 10px; z-index: 10; color: #fefefe; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
</head>
<body>
    <div id="ui-container">
        <input type="checkbox" id="toggle-polygon" checked>ポリゴン表示<br>
        <input type="checkbox" id="toggle-points" checked>点群表示<br>
        <input type="checkbox" id="toggle-color"><select id="class-select"></select>
    </div>

    <div id="canvas-container"></div>

    <script id="mesh-data" type="application/json">
        __MESH_DATA_JSON__
    </script>

    <script>
        const rawData = document.getElementById("mesh-data").textContent;
        const meshData = JSON.parse(rawData);

        const container = document.getElementById("canvas-container");
        const scene = new THREE.Scene();

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45.0, window.innerWidth / window.innerHeight, 0.1, 1000.0);
        camera.position.set(0.0, 5.0, 10.0);
        camera.lookAt(0.0, 0.0, 0.0);
        const controls = new THREE.TrackballControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5.0, 10.0, 7.0);
        scene.add(dirLight);
        const subLight = new THREE.DirectionalLight(0xffffff, 0.6);
        subLight.position.set(5.0, -10.0, 7.0);
        scene.add(subLight);

        const geometry = new THREE.BufferGeometry();
        const verticesArray = new Float32Array(meshData.vertices);
        const colorsArray = new Float32Array(meshData.vertices.length);
        const indicesArray = new Uint32Array(meshData.indices);
        geometry.setAttribute("position", new THREE.BufferAttribute(verticesArray, 3));
        geometry.setAttribute("color", new THREE.BufferAttribute(colorsArray, 3));
        geometry.setIndex(new THREE.BufferAttribute(indicesArray, 1));
        geometry.computeVertexNormals();
        const material = new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.5, metalness: 0.2, side: THREE.DoubleSide });
        const meshObject = new THREE.Mesh(geometry, material);
        scene.add(meshObject);

        const pointsGeometry = new THREE.BufferGeometry();
        const pointVerticesArray = new Float32Array(meshData.point_vertices);
        const pointColorsArray = new Float32Array(meshData.point_colors);
        pointsGeometry.setAttribute("position", new THREE.BufferAttribute(pointVerticesArray, 3));
        pointsGeometry.setAttribute("color", new THREE.BufferAttribute(pointColorsArray, 3));
        const pointsMaterial = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, sizeAttenuation: true });
        const pointsObject = new THREE.Points(pointsGeometry, pointsMaterial);
        scene.add(pointsObject);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.handleResize();
        });

        const togglePolygonCheckbox = document.getElementById("toggle-polygon");
        togglePolygonCheckbox.addEventListener("change", (e) => { meshObject.visible = e.target.checked; });

        const togglePointsCheckbox = document.getElementById("toggle-points");
        togglePointsCheckbox.addEventListener("change", (e) => { pointsObject.visible = e.target.checked; });

        const classSelect = document.getElementById("class-select");
        const totalClasses = meshData.classes[0] ? meshData.classes[0].length : 0;
        for (let i = 0; i < totalClasses; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.textContent = `クラス ${i}`;
            classSelect.appendChild(option);
        }
        classSelect.value = -1;

        classSelect.addEventListener("change", (e) => {
            const classIndex = parseInt(e.target.value, 10);
            if (classIndex == -1) return;
            const values = meshData.classes.map(v => v[classIndex]);
            const colorAttribute = geometry.getAttribute("color");
            for (let i = 0; i < values.length; i++) {
                const r = values[i];
                const g = 0.2;
                const b = 1.0 - values[i];
                colorAttribute.setXYZ(i, r, g, b);
            }
            colorAttribute.needsUpdate = true;
        });

        const toggleColorCheckbox = document.getElementById("toggle-color");
        toggleColorCheckbox.addEventListener("change", (e) => {
            material.vertexColors = e.target.checked;
            material.color.setHex(e.target.checked ? 0xffffff : 0x3498db);
            material.needsUpdate = true;
        });
    </script>
</body>
</html>
