[project]
name = "robust-scene-mapper"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "backports-zstd>=1.6.0",
    "evo>=1.36.5",
    "kornia>=0.8.1",
    "lifting-seg",
    "luigi>=3.8.1",
    "msgpack>=1.2.2",
    "numpy>=2.2.6",
    "open3d>=0.19.0",
    "opencv-python-headless>=4.12.0.88",
    "pycolmap-cuda12>=4.0.4",
    "pyyaml>=6.0.2",
    "rich>=15.0.0",
    "scipy>=1.16.1",
    "torch==2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.9.0",
]

[tool.uv.sources]
lifting-seg = { path = "third_party/lifting-seg" }

[tool.ruff]
target-version = "py312"
line-length = 999

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RET",
    "ARG",
    "RUF",
    "ANN",
    "PYI",
]
fixable = ["ALL"]

